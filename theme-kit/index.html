<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme kit</title>
<link rel="stylesheet" href="themes.css">
<style>
body { margin: 0; background: var(--ivory); color: var(--choc); font: 16px/1.5 system-ui, sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-family: Georgia, serif; font-weight: 500; font-size: 40px; margin: 0 0 4px; }
.muted { color: var(--choc2); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
.pick button { min-height: 40px; padding: 0 14px; border: 1px solid var(--line2); background: var(--card); color: var(--choc); cursor: pointer; font: inherit; }
.pick button[aria-pressed="true"] { background: var(--choc); color: var(--ivory); border-color: var(--choc); }
.stage { background: var(--sk-dark); color: var(--sk-glow); padding: 32px 24px; margin: 20px 0; }
.stage strong { display: block; font-family: Georgia, serif; font-size: 28px; font-weight: 500; color: var(--sk-glow); }
.stage a { display: inline-block; margin-top: 12px; padding: 10px 18px; background: var(--sk-cta); color: var(--sk-on-cta); text-decoration: none; font-weight: 600; }
.btn { display: inline-block; padding: 12px 20px; background: var(--cta); color: var(--on-cta); border: 0; font: inherit; font-weight: 600; }
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
.sw div { border: 1px solid var(--line); background: var(--card); font-size: 12px; }
.sw span { display: block; height: 56px; }
.sw code { display: block; padding: 6px 8px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BUD &amp; THINGS themes</h1>
  <p class="muted" id="use"></p>
  <div class="pick" id="pick"></div>
  <div class="stage"><span id="eyebrow"></span><strong>Made with thought. Given with feeling.</strong><a href="#">Shop the collection</a></div>
  <button class="btn" type="button">Add to cart</button>
  <div class="sw" id="sw"></div>
</div>
<script>
fetch('themes.json').then((r) => r.json()).then((T) => {
  const pick = document.getElementById('pick'), sw = document.getElementById('sw');
  const show = (k) => {
    if (k === 'signature') delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = k;
    document.getElementById('use').textContent = T[k].use; document.getElementById('eyebrow').textContent = T[k].eyebrow;
    [...pick.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
    sw.innerHTML = Object.entries(T[k].css).filter(([, v]) => /^#/.test(v)).map(([n, v]) => `<div><span style="background:${v}"></span><code>${n}<br>${v}</code></div>`).join('');
  };
  pick.innerHTML = Object.keys(T).map((k) => `<button type="button" data-k="${k}">${T[k].name}</button>`).join('');
  pick.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.k); });
  show('signature');
});
</script>
</body>
</html>
