# Checks the BUD & THINGS prototype on every pull request that touches it: contrast, text size, tap targets, headings,
# alt text, names for links and fields, skip link, sideways scroll, page errors. See bud-and-things/tools/audit.js.
name: Page audit

on:
  pull_request:
    paths:
      - 'bud-and-things/prototype/**'
      - 'bud-and-things/tools/audit.js'
      - 'bud-and-things/tools/test-*.js'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to exact commits (Dependabot proposes updates), so a moved tag can't change the build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a browser
        run: |
          mkdir -p "$RUNNER_TEMP/audit" && cd "$RUNNER_TEMP/audit"
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run the audit
        run: PLAYWRIGHT_PATH="$RUNNER_TEMP/audit/node_modules/playwright" node bud-and-things/tools/audit.js
      - name: Run the sheet import and invoice tests
        run: |
          node bud-and-things/tools/test-import.js
          node bud-and-things/tools/test-invoice.js
      - name: Run the shop flow test
        run: |
          sh bud-and-things/tools/preview.sh >/dev/null 2>&1 &
          sleep 3
          PLAYWRIGHT_PATH="$RUNNER_TEMP/audit/node_modules/playwright" node bud-and-things/tools/test-flow.js
