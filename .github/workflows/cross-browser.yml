name: Cross-browser check

# The shop in Firefox and in WebKit (Safari's engine), which the main audit does not cover (it uses Chromium).
# Separate from the "Page audit" check so it cannot hold up a merge. Runs by hand (Actions tab, Run workflow), and when
# this file or the test changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cross-browser.yml'
      - 'bud-and-things/tools/test-browsers.js'

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-24.04 # Playwright 1.49 knows the system packages of 24.04, not of the newer default image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Firefox and WebKit
        run: |
          mkdir -p "$RUNNER_TEMP/xb" && cd "$RUNNER_TEMP/xb"
          npm init -y >/dev/null 2>&1 && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps firefox webkit
      - name: Run the shop in Firefox
        run: |
          sh bud-and-things/tools/preview.sh >/dev/null 2>&1 &
          sleep 3
          BROWSERS=firefox PLAYWRIGHT_PATH="$RUNNER_TEMP/xb/node_modules/playwright" node bud-and-things/tools/test-browsers.js
      - name: Run the shop in WebKit (Safari)
        if: always()
        run: |
          VERBOSE=1 BROWSERS=webkit PLAYWRIGHT_PATH="$RUNNER_TEMP/xb/node_modules/playwright" node bud-and-things/tools/test-browsers.js
