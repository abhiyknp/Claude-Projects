# Publishes the BUD & THINGS shop prototype to GitHub Pages.
# Live at https://abhiyknp.github.io/Claude-Projects/ once
# Settings → Pages → Source is set to "GitHub Actions".
name: Deploy prototype to Pages

on:
  push:
    branches: [main]
    paths:
      - "bud-and-things/prototype/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bud-and-things/prototype
      - id: deployment
        uses: actions/deploy-pages@v4
