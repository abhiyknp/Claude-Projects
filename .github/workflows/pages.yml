# Publishes the BUD & THINGS prototype (bud-and-things/prototype) to GitHub Pages on every push to main, and daily.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Prototype preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'bud-and-things/prototype/**'
      - '.github/workflows/pages.yml'
      - 'bud-and-things/tools/build-pinterest.js'
  # once a day, so product, price, stock and photo changes made in the Owner view reach the Pinterest feeds
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r bud-and-things/prototype/. _site/
          # The prototype page is written as page content (it is also published as a Claude artifact, which adds the
          # document shell). Give it a full HTML document here.
          {
            printf '%s\n' '<!doctype html>' '<html lang="en-IN">' '<head>' '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' \
              '<meta name="description" content="BUD & THINGS by Ashi: thoughtful objects, meaningful moments.">' \
              '<meta property="og:type" content="website">' '<meta property="og:site_name" content="BUD & THINGS by Ashi">' \
              '<meta property="og:title" content="BUD & THINGS by Ashi">' \
              '<meta property="og:description" content="Made with thought. Given with feeling.">' \
              '<meta property="og:url" content="https://budandthings.com/">' \
              '<meta property="og:image" content="https://budandthings.com/assets/share.jpg">' \
              '<meta property="og:image:width" content="1200">' '<meta property="og:image:height" content="630">' \
              '<meta property="og:image:alt" content="BUD & THINGS by Ashi logo: Made with thought. Given with feeling.">' \
              '<meta name="twitter:card" content="summary_large_image">' \
              '<meta name="p:domain_verify" content="c2fef068eb883efd7abb4d6cdb0c7bc4"/>' \
              '<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">' '<link rel="icon" href="assets/favicon.ico" sizes="any">' '<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">' \
              '<style>[hidden]{display:none!important}body{margin:0}</style>' '</head>' '<body>'
            cat bud-and-things/prototype/index.html
            printf '%s\n' '</body>' '</html>'
          } > _site/index.html
          touch _site/.nojekyll
      - name: Add product pages and Pinterest feeds
        run: node bud-and-things/tools/build-pinterest.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
