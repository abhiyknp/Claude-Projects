<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="size" content="1080x1920"><link rel="stylesheet" href="base.css">
<style>
.canvas { padding: 260px 90px 360px; gap: 34px; justify-content: space-between; }
.canvas .logo { width: 260px; flex: none; }
.arch { flex: 1; min-height: 0; width: 700px; background-image: url('{{photo_url}}'); }
.txt { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; flex: none; }
h1 { font: 500 84px/1.05 var(--serif); } .meta { font: 500 28px/1.3 var(--sans); letter-spacing: .08em; color: var(--gold-soft); }
.badge { top: 330px; right: 90px; }
</style></head><body>
<div class="canvas story on-maroon"><div class="frame" style="inset:36px 36px 36px"></div>
<div class="logo rev"></div>{{badge_html}}<div class="arch" data-fit></div>
<div class="txt"><div class="kicker">{{kicker}}</div><h1 data-fit>{{name}}</h1><div class="meta">{{meta}}</div>{{price_html}}</div></div></body></html>
