<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="size" content="1080x1920"><link rel="stylesheet" href="base.css">
<style>
.canvas { padding: 270px 100px 360px; justify-content: space-between; text-align: center; }
.canvas .logo { width: 300px; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 36px; }
h1 { font: 500 100px/1.1 var(--serif); } .sub { font: 400 32px/1.55 var(--sans); color: var(--gold-soft); max-width: 780px; }
.slot { width: 800px; height: 260px; border: 2px dashed rgba(214,163,74,.0); }
.guides .slot { border-color: var(--gold); }
</style></head><body>
<div class="canvas story on-maroon"><div class="frame"></div>
<div class="logo rev"></div>
<div class="mid"><div class="kicker">{{kicker}}</div><h1 data-fit>{{title}}</h1><p class="sub" data-fit>{{sub}}</p></div>
<div class="slot"></div></div></body></html>
