<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="size" content="1080x1350"><link rel="stylesheet" href="base.css">
<style>
.canvas { justify-content: center; gap: 40px; text-align: center; padding: 90px 110px; }
.canvas .logo { width: 560px; }
.rule { width: 160px; height: 3px; background: var(--gold); }
h1 { font: 500 118px/1.04 var(--serif); } h1 em { display: block; }
.sub { font: 400 32px/1.55 var(--sans); color: var(--gold-soft); max-width: 740px; }
</style></head><body>
<div class="canvas post on-maroon"><div class="frame"></div>
<div class="logo rev"></div><div class="rule"></div>
<div class="kicker">{{kicker}}</div><h1 data-fit>{{title}}</h1><p class="sub" data-fit>{{sub}}</p>
<span class="foot" style="margin-top:20px">{{site}}</span></div></body></html>
