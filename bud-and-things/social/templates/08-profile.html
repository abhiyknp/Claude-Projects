<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="size" content="1080x1080"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 1080px; justify-content: center; gap: 26px; }
.ring { position: absolute; inset: 70px; border-radius: 50%; border: 6px solid var(--gold); box-shadow: inset 0 0 0 16px rgba(214,163,74,.16); }
.leaf { width: 360px; aspect-ratio: 400/418; background: var(--gold); -webkit-mask: url(../../prototype/assets/leaf.png) center / contain no-repeat; mask: url(../../prototype/assets/leaf.png) center / contain no-repeat; margin-top: -30px; }
.wm { width: 400px; height: 42px; background: var(--cream); -webkit-mask: url(../../prototype/assets/logo-wordmark.png) center / contain no-repeat; mask: url(../../prototype/assets/logo-wordmark.png) center / contain no-repeat; }
.by { font: italic 500 34px/1 var(--serif); color: var(--gold-soft); }
</style></head><body>
<div class="canvas on-maroon"><div class="ring"></div><div class="leaf"></div><div class="wm"></div><div class="by">by Ashi</div></div></body></html>
