<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="size" content="1080x1350"><link rel="stylesheet" href="base.css">
<style>
.canvas { padding: 78px 90px 70px; gap: 26px; }
.canvas .logo { width: 250px; flex: none; }
.arch { flex: 1; min-height: 0; width: 640px; background-image: url('{{photo_url}}'); }
.txt { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; flex: none; }
h1 { font-size: 78px; line-height: 1.05; font-weight: 500; font-family: var(--serif); }
.meta { font: 500 26px/1.3 var(--sans); letter-spacing: .08em; color: var(--gold-soft); }
.row { display: flex; gap: 22px; align-items: center; margin-top: 8px; }
.pill { font-size: 30px; padding: 14px 30px; }
.badge { top: 150px; right: 90px; }
</style></head><body>
<div class="canvas post on-maroon"><div class="frame"></div>
<div class="logo rev"></div>
{{badge_html}}
<div class="arch" data-fit></div>
<div class="txt"><div class="kicker">{{kicker}}</div><h1 data-fit>{{name}}</h1><div class="meta">{{meta}}</div>
<div class="row">{{price_html}}<span class="foot">{{site}}</span></div></div></div></body></html>
