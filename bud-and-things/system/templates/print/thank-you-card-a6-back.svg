<svg xmlns="http://www.w3.org/2000/svg" width="111mm" height="154mm" viewBox="-3 -3 111 154" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Thank-you card A6, back</title><g id="artwork"><rect x="-3" y="-3" width="111" height="154" fill="#FFFBF5"/><text x="12" y="26" font-family="'Montserrat', sans-serif" font-size="2.12" font-weight="500" fill="#A55B3F" text-anchor="start" letter-spacing="0.7">A NOTE FROM ASHI</text><text x="12" y="38" font-family="'Playfair Display', serif" font-size="3.18" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">This piece was poured by hand, in a small</text><text x="12" y="44" font-family="'Playfair Display', serif" font-size="3.18" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">batch, at home in India. I hope it makes an</text><text x="12" y="50" font-family="'Playfair Display', serif" font-size="3.18" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">ordinary evening feel a little warmer.</text><text x="12" y="60" font-family="'Playfair Display', serif" font-size="3.53" font-weight="400" font-style="italic" fill="#A55B3F" text-anchor="start" letter-spacing="0">— Ashi</text><rect x="12" y="70" width="81" height=".2" fill="#3D281E" opacity=".35"/><text x="12" y="80" font-family="'Montserrat', sans-serif" font-size="2.12" font-weight="500" fill="#A55B3F" text-anchor="start" letter-spacing="0.7">CARING FOR YOUR CANDLE</text><g transform="translate(12,85) scale(0.25)" fill="none" stroke="#3D281E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10.5v8.2a1.8 1.8 0 0 0 1.8 1.8h10.4a1.8 1.8 0 0 0 1.8-1.8v-8.2"/><path d="M5 10.5c2.3 1.3 11.7 1.3 14 0"/><path d="M12 9.5V7"/><path d="M12 7c-1 0-1.6-.7-1.6-1.6 0-1 .8-1.6 1.6-2.9.8 1.3 1.6 1.9 1.6 2.9 0 .9-.6 1.6-1.6 1.6z"/></g><text x="21" y="89.4" font-family="'Montserrat', sans-serif" font-size="2.47" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">Let the first burn melt edge to edge</text><g transform="translate(12,94) scale(0.25)" fill="none" stroke="#3D281E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="6.5" cy="9.5" r="2.5"/><path d="M8.6 11 19.5 4.5M8.6 16 19.5 22"/></g><text x="21" y="98.4" font-family="'Montserrat', sans-serif" font-size="2.47" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">Trim the wick to 5 mm each time</text><g transform="translate(12,103) scale(0.25)" fill="none" stroke="#3D281E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.8 1.8M9.5 3h5"/></g><text x="21" y="107.4" font-family="'Montserrat', sans-serif" font-size="2.47" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">Burn for up to 4 hours at a time</text><g transform="translate(12,112) scale(0.25)" fill="none" stroke="#3D281E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></g><text x="21" y="116.4" font-family="'Montserrat', sans-serif" font-size="2.47" font-weight="400" fill="#3D281E" text-anchor="start" letter-spacing="0">Never leave it burning unattended</text><text x="52.5" y="136" font-family="'Montserrat', sans-serif" font-size="2.26" font-weight="400" fill="#3D281E" text-anchor="middle" letter-spacing="0.3">@budandthings  ·  budandthings.com</text></g><g id="guides-do-not-print" opacity="0.9"><rect x="0" y="0" width="105" height="148" fill="none" stroke="#E6007E" stroke-width="0.25"/><rect x="3" y="3" width="99" height="142" fill="none" stroke="#00A0E0" stroke-width="0.2" stroke-dasharray="1 1"/></g></svg>