<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light a candle for someone · BUD &amp; THINGS</title>
<meta name="description" content="Send a wish. They light the candle, make a wish, blow it out, and a gift from BUD &amp; THINGS appears.">
<meta name="theme-color" content="#150206">
<link rel="canonical" href="https://budandthings.com/catalogue/light/">
<meta property="og:type" content="website"><meta property="og:title" content="Someone lit a candle for you"><meta property="og:description" content="Open it in the dark. Hold the wick to light it. Make a wish."><meta property="og:url" content="https://budandthings.com/catalogue/light/"><meta property="og:image" content="https://budandthings.com/catalogue/share/og.png"><meta name="twitter:card" content="summary_large_image">
<style>
@font-face{font-family:'Playfair Display';src:url(../../prototype/assets/fonts/playfair.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Playfair Display';font-style:italic;src:url(../../prototype/assets/fonts/playfair-italic.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Montserrat';src:url(../../prototype/assets/fonts/montserrat.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--maroon:#8F1834;--maroon-d:#7A1229;--gold:#D6A34A;--cream:#F8F0E4;--ink:#150206}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font:400 16px/1.5 Montserrat,system-ui,sans-serif;text-align:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(214,163,74,.55),rgba(143,24,52,.35) 38%,transparent 70%);opacity:0;transition:opacity 1.6s}
body.lit .glow{opacity:1}body.lit{background:#1d0409}
main{position:relative;min-height:100%;max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 36px;display:flex;flex-direction:column;align-items:center}
h1{font:600 30px/1.15 'Playfair Display',serif}h1 i{color:var(--gold);font-weight:500}
.sub{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:8px 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--gold);background:var(--gold);color:var(--ink);font:600 15px Montserrat,sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--cream)}
/* sender */
form{width:100%;text-align:left;display:grid;gap:12px}
label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
input,textarea,select{width:100%;margin-top:4px;background:rgba(248,240,228,.08);border:1px solid rgba(214,163,74,.5);border-radius:12px;color:var(--cream);font:400 16px Montserrat,sans-serif;padding:12px}
select option{color:#150206}
textarea{min-height:84px;resize:vertical}
.out{display:grid;gap:10px;width:100%;margin-top:22px}
.row{display:flex;gap:10px}.row .btn{flex:1}
/* candle */
.stage{position:relative;width:100%;height:330px;margin:6px 0 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.candle{position:absolute;left:50%;bottom:0;width:92px;height:190px;margin-left:-46px;border-radius:10px 10px 14px 14px;background:linear-gradient(90deg,#c98a97,#f3dfd0 45%,#c98a97);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.candle::before{content:"";position:absolute;top:-6px;left:0;right:0;height:16px;border-radius:50%;background:#f8e9dc}
.wick{position:absolute;left:50%;bottom:188px;width:4px;height:22px;margin-left:-2px;background:#2a1a14;border-radius:2px;z-index:2}
.ring{position:absolute;left:50%;bottom:170px;width:56px;height:56px;margin-left:-28px;border-radius:50%;border:2px solid var(--gold);opacity:0;transform:scale(.4)}
.hold .ring{animation:ring 1.1s linear forwards}
@keyframes ring{0%{opacity:.9;transform:scale(1.9)}100%{opacity:.9;transform:scale(.5)}}
.flame{position:absolute;left:50%;bottom:206px;width:34px;height:70px;margin-left:-17px;transform-origin:50% 100%;opacity:0;transform:scale(0);transition:opacity .4s,transform .6s;z-index:3;filter:drop-shadow(0 0 22px rgba(214,163,74,.9))}
.flame::before{content:"";position:absolute;inset:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 78%,#fff6d6 0%,#ffd66e 35%,#e8892a 70%,rgba(143,24,52,.0) 100%)}
body.lit .flame{opacity:1;transform:scale(1);animation:flick 1.3s infinite ease-in-out}
body.out .flame{opacity:0;transform:scale(.2);transition:opacity .5s,transform .5s;animation:none}
@keyframes flick{0%,100%{transform:scale(1) skewX(0)}25%{transform:scale(1.04,.96) skewX(2deg)}50%{transform:scale(.97,1.05) skewX(-2deg)}75%{transform:scale(1.03,.98) skewX(1deg)}}
.smoke{position:absolute;left:50%;bottom:206px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(248,240,228,.5);filter:blur(5px);opacity:0}
body.out .smoke{animation:smoke 3s ease-out forwards}.smoke:nth-of-type(2){animation-delay:.4s!important;margin-left:6px}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-140px) scale(9)}}
.hint{min-height:48px;font:italic 400 22px/1.3 'Playfair Display',serif;color:var(--cream)}
.small{font-size:13px;opacity:.75;margin-top:10px}
.gift{width:100%;animation:rise 1.4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.gift img{width:min(280px,70vw);aspect-ratio:1;object-fit:cover;border-radius:18px;border:2px solid var(--gold);box-shadow:0 0 60px rgba(214,163,74,.35)}
.gift .note{font:italic 500 24px/1.35 'Playfair Display',serif;margin:20px 6px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.gift .from{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:12px;margin-bottom:22px}
.gift .name{font:600 20px 'Playfair Display',serif;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body><div class="glow"></div>
<main>
<!-- SENDER -->
<section id="send" hidden style="width:100%">
<h1>Light a candle<br><i>for someone</i></h1><p class="sub">A gift link from BUD &amp; THINGS</p>
<form id="f">
<div><label for="to">Their name</label><input id="to" maxlength="30" placeholder="Priya" autocomplete="off"></div>
<div><label for="fr">Your name</label><input id="fr" maxlength="30" placeholder="Riya" autocomplete="off"></div>
<div><label for="m">Your wish for them</label><textarea id="m" maxlength="180" placeholder="Happy birthday! May this year glow."></textarea></div>
<div><label for="p">Candle they will find</label><select id="p"></select></div>
</form>
<div class="out">
<a class="btn" id="wa" target="_blank" rel="noopener">Send on WhatsApp</a>
<div class="row"><button class="btn alt" id="nat" hidden>Share…</button><button class="btn alt" id="cp">Copy link</button></div>
<a class="btn alt" id="pv">Preview it</a>
<p class="small">Their name, your wish and the candle live inside the link. Nothing is stored anywhere.</p>
</div></section>
<!-- RECEIVER -->
<section id="recv" hidden style="width:100%">
<h1 id="hi"></h1><p class="sub" id="who"></p>
<div class="stage" id="stage"><div class="candle"></div><div class="wick"></div><div class="ring"></div><div class="flame"></div><div class="smoke"></div><div class="smoke"></div></div>
<p class="hint" id="hint">Hold the wick to light it.</p>
<p class="small" id="sm">Best in a dim room.</p>
<div class="gift" id="gift" hidden><img id="gi" alt=""><p class="note" id="gn"></p><p class="from" id="gf"></p>
<a class="btn" href="../">See the whole catalogue</a><p class="name" id="gname"></p>
<p class="small" style="margin-top:22px"><a class="btn alt" id="again" href="./">Light one for someone back</a></p></div>
</section>
</main>
<script>
(function(){
var P=[['bnt-prd-cg-001','Iced Latte glass candle'],['bnt-prd-cg-002','Vanilla Gold glass candle'],['bnt-prd-cg-004','Strawberry Cream glass candle'],['bnt-prd-cg-008','Daisy Pop glass candle'],['bnt-prd-mc-004','Blooming Rose moulded candle'],['bnt-prd-mc-002','Sunflower Float moulded candle'],['bnt-prd-tl-004','Love Note tealight'],['bnt-prd-tl-005','Violet Whisper tealight'],['bnt-prd-jt-001','Rose Dawn Jesmonite tray'],['bnt-prd-jt-003','Cloud Marble Jesmonite tray']];
var $=function(i){return document.getElementById(i)},BASE=location.origin+location.pathname;
var q=new URLSearchParams(location.hash.slice(1)),has=q.get('m')||q.get('t');
if(has)receive();else send();
function clean(s,n){return String(s||'').slice(0,n)}
function send(){
$('send').hidden=false;document.body.style.background='#150206';
var sel=$('p');P.forEach(function(x){var o=document.createElement('option');o.value=x[0];o.textContent=x[1];sel.appendChild(o)});
function link(){var u=new URLSearchParams();u.set('t',clean($('to').value,30));u.set('f',clean($('fr').value,30));u.set('m',clean($('m').value,180));u.set('p',sel.value);return 'https://budandthings.com/catalogue/light/#'+u}
function upd(){var l=link(),t=($('fr').value||'Someone')+' lit a candle for you. Open it in the dark: '+l;
$('wa').href='https://wa.me/?text='+encodeURIComponent(t);$('pv').href=BASE+l.slice(l.indexOf('#'))}
['to','fr','m','p'].forEach(function(i){$(i).addEventListener('input',upd)});upd();
if(navigator.share){$('nat').hidden=false;$('nat').onclick=function(){navigator.share({title:'A candle for you',text:($('fr').value||'Someone')+' lit a candle for you.',url:link()}).catch(function(){})}}
$('cp').onclick=function(){var l=link(),d=function(){$('cp').textContent='Link copied'};(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(d,function(){prompt('Copy this link',l)})}}
function receive(){
$('recv').hidden=false;
var t=clean(q.get('t'),30),f=clean(q.get('f'),30),m=clean(q.get('m'),180),p=q.get('p')||P[0][0];
if(!/^bnt-prd-[a-z]{2,3}-\d{3}$/.test(p))p=P[0][0];
$('hi').textContent=t?'For '+t:'A candle for you';
$('who').textContent=f?'Lit by '+f:'From BUD & THINGS';
var stage=$('stage'),hold=null,state=0,mic=null;
function lit(){if(state)return;state=1;document.body.classList.add('lit');$('hint').textContent='Make a wish. Then blow it out.';$('sm').textContent='Blow on your phone, or tap the flame.';if(navigator.vibrate)navigator.vibrate(30);listen()}
function down(e){if(state)return;e.preventDefault();stage.classList.remove('hold');void stage.offsetWidth;stage.classList.add('hold');$('hint').textContent='Keep holding…';hold=setTimeout(lit,1100)}
function up(){clearTimeout(hold);if(!state){stage.classList.remove('hold');$('hint').textContent='Hold the wick to light it.'}}
stage.addEventListener('pointerdown',function(e){if(state==1){blow();return}down(e)});
stage.addEventListener('pointerup',up);stage.addEventListener('pointerleave',up);stage.addEventListener('pointercancel',up);
document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();state?blow():lit()}});
function listen(){try{navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
var C=new (window.AudioContext||window.webkitAudioContext)(),a=C.createAnalyser();a.fftSize=512;C.createMediaStreamSource(s).connect(a);mic={s:s,C:C};
var d=new Uint8Array(a.fftSize),n=0;(function tick(){if(state!==1)return;a.getByteTimeDomainData(d);var r=0;for(var i=0;i<d.length;i++){var v=(d[i]-128)/128;r+=v*v}r=Math.sqrt(r/d.length);n=r>.12?n+1:0;if(n>5){blow();return}requestAnimationFrame(tick)})()}).catch(function(){})}catch(e){}}
function blow(){if(state!==1)return;state=2;document.body.classList.remove('lit');document.body.classList.add('out');
if(mic){mic.s.getTracks().forEach(function(x){x.stop()});try{mic.C.close()}catch(e){}}
$('hint').textContent='Wish made.';$('sm').hidden=true;if(navigator.vibrate)navigator.vibrate([20,40,20]);
setTimeout(function(){stage.hidden=true;$('hint').hidden=true;reveal()},1900)}
function reveal(){var g=$('gift');g.hidden=false;document.body.classList.add('lit');
var im=$('gi');im.src='../img/'+p+'.jpg';var nm=(P.filter(function(x){return x[0]===p})[0]||[0,''])[1];im.alt=nm;$('gname').textContent=nm;
$('gn').textContent=m?'“'+m+'”':'Wishing you a little light.';$('gf').textContent=f?'— '+f:''}
}
})();
</script></body></html>
