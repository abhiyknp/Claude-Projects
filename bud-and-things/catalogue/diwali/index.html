 if(!fav.length){ls.innerHTML='<div class="empty">Nothing saved yet.<br>Tap the heart, or double-tap a photo, on anything you love.</div>';$('pl').textContent='Save pieces as you swipe, then send them to us in one message.';$('send').textContent='Start swiping';$('send').onclick=function(){slides[2].scrollIntoView({behavior:'smooth'})};return}
 var t=0;fav.forEach(function(id){var p=ALL[id];t+=p.p;var d=document.createElement('div');d.className='it';d.innerHTML='<img alt=""><b></b><span></span><button type="button" aria-label="Remove">×</button>';d.querySelector('img').src='../img/'+p.i;d.querySelector('b').textContent=p.n;d.querySelector('span').textContent=rs(p.p);d.querySelector('button').onclick=function(){toggle(id)};ls.appendChild(d)});
 $('tt').innerHTML='<div class="total">Total<span>'+rs(t)+'</span></div>';$('pl').textContent=fav.length+(fav.length>1?' pieces':' piece')+' saved. Send them to us and we will reply with stock and delivery.';
 $('send').textContent=D.wa?'Send my list on WhatsApp':'Send my list on Instagram';
 $('send').onclick=function(){var m=listText();if(D.wa){window.open('https://wa.me/'+D.wa+'?text='+encodeURIComponent(m),'_blank')}else{var go=function(){toast('List copied. Paste it in the chat');setTimeout(function(){window.open('https://ig.me/m/'+D.ig,'_blank')},900)};(navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).then(go,function(){prompt('Copy your list',m)})}}}
var SHARE='https://budandthings.com/catalogue/diwali/';
$('shr').onclick=function(){var t='Look what Ashi is making this Diwali 🪔 Swipe through';if(navigator.share)navigator.share({title:'Diwali, made by hand',text:t,url:SHARE+'?utm_source=share'}).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent(t+': '+SHARE+'?utm_source=whatsapp'),'_blank')};
sync();
// in-view + progress
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');var i=slides.indexOf(e.target);$('pb').style.width=(i/(slides.length-1)*100)+'%'}})},{root:reel,threshold:.55});slides.forEach(function(s){io.observe(s)});
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;var cur=Math.round(reel.scrollTop/reel.clientHeight),k={ArrowDown:1,PageDown:1,ArrowUp:-1,PageUp:-1,' ':1}[e.key];if(k){e.preventDefault();slides[Math.max(0,Math.min(slides.length-1,cur+k))].scrollIntoView({behavior:'smooth'})}});
$('pk').onclick=function(e){e.preventDefault();pk.scrollIntoView({behavior:'smooth'})};
})();
</script></body></html>
